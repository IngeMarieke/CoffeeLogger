<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestpresso - Coffee Logger</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bestpresso</h1>
            <p class="subtitle">Coffee Logger</p>
            <div id="authSection" class="auth-section">
                <div id="syncStatus" class="sync-status">🔴 Local only</div>
                <div id="userInfo" class="user-info" style="display: none;"></div>
                <button id="loginBtn" class="auth-btn login-btn" onclick="login()">Login with Google</button>
                <button id="logoutBtn" class="auth-btn logout-btn" onclick="logout()" style="display: none;">Logout</button>
            </div>
        </header>

        <main>
            <form id="coffeeForm" class="coffee-form">
                <div class="form-group">
                    <label for="groundsIn">Grounds In (grams)</label>
                    <input type="number" id="groundsIn" name="groundsIn" step="0.1" min="0" required>
                </div>

                <div class="form-group">
                    <label for="time">Time (seconds)</label>
                    <div class="time-input-group">
                        <input type="number" id="time" name="time" min="0" step="0.1" required>
                        <button type="button" id="timerBtn" class="timer-btn timer-start">Start</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="coffeeOut">Coffee Out (grams)</label>
                    <input type="number" id="coffeeOut" name="coffeeOut" step="0.1" min="0" required>
                </div>

                <div class="form-group">
                    <label for="brand">Brand (optional)</label>
                    <input type="text" id="brand" name="brand" placeholder="e.g., Lavazza, Illy">
                </div>

                <button type="submit" class="submit-btn">Log Coffee</button>
            </form>

            <section class="clean-section">
                <h2>Equipment Cleaning</h2>
                <div class="clean-form">
                    <div class="form-group">
                        <label for="lastClean">Last Clean Date</label>
                        <div class="date-input-group">
                            <input type="date" id="lastClean" name="lastClean">
                            <button type="button" id="nowBtn" class="now-btn">Now</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="logs-section">
                <h2>Recent Logs</h2>
                <div id="logsContainer" class="logs-container">
                    <!-- Logs will be populated here -->
                </div>
                <button id="clearLogs" class="clear-btn">Clear All Logs</button>
            </section>
        </main>
    </div>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
